<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="xGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Rounded Canvas -->
  <rect width="256" height="256" rx="48" fill="#0b1120" />

  <!-- Outer Shield Aura -->
  <path d="M128 32 C176 32 208 52 208 96 C208 160 152 204 128 224 C104 204 48 160 48 96 C48 52 80 32 128 32 Z" 
        fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" opacity="0.4"/>

  <!-- Main Shield -->
  <path d="M128 36 C172 36 200 54 200 96 C200 156 150 196 128 214 C106 196 56 156 56 96 C56 54 84 36 128 36 Z" 
        fill="url(#shieldGrad)" stroke="url(#accentGrad)" stroke-width="4"/>

  <!-- Inner Cyber Circuit Pattern -->
  <path d="M128 60 L128 85 M95 120 L70 120 M161 120 L186 120 M128 155 L128 180" 
        stroke="#0284c7" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <circle cx="70" cy="120" r="4" fill="#38bdf8" />
  <circle cx="186" cy="120" r="4" fill="#38bdf8" />
  <circle cx="128" cy="60" r="4" fill="#38bdf8" />
  <circle cx="128" cy="180" r="4" fill="#38bdf8" />

  <!-- Glowing Cyber "X" Emblem -->
  <path d="M102 94 L154 146 M154 94 L102 146" stroke="url(#xGrad)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="128" cy="120" r="8" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="128" cy="120" r="5" fill="#f43f5e"/>
</svg>
